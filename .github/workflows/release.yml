name: Release

on:
  push:
    tags:
      - "latest"
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile app.py discord_rpc.py tray.py run_discord_rpc.py

      - name: Build archive
        run: |
          git archive --format=zip --prefix=boinc-discord/ \
            -o "boinc-discord.zip" HEAD

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes || true
          gh release create "${GITHUB_REF_NAME}" "boinc-discord.zip" \
            --title "BOINC Discord RPC" \
            --notes-file .github/release_notes.md
